<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700" role="img" aria-label="Mapa de empatia de Tiago">
  <rect width="940" height="700" fill="#EAE8E0"/>

  <rect x="2" y="2" width="936" height="426" fill="none" stroke="#1A1D23" stroke-width="2"/>
  <g stroke="#CFCABA" stroke-width="1.2" stroke-dasharray="7 5">
    <line x1="2" y1="2" x2="938" y2="428"/>
    <line x1="938" y1="2" x2="2" y2="428"/>
  </g>

  <text x="470" y="30" text-anchor="middle" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE PENSA E SENTE?</text>
  <rect x="72" y="46" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="72" y="89" width="190" height="3" fill="#3A6098"/><text x="80" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Não achei que fosse</text><text x="80" y="79" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">interessar a alguém</text><rect x="274" y="46" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="274" y="89" width="190" height="3" fill="#3A6098"/><text x="282" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Orgulho de saber o que os</text><text x="282" y="79" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">outros não sabem</text><rect x="476" y="46" width="190" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="476" y="75" width="190" height="3" fill="#3A6098"/><text x="484" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Prédio vazio me incomoda</text><rect x="678" y="46" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="678" y="89" width="190" height="3" fill="#3A6098"/><text x="686" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Publicar é pra quem tem</text><text x="686" y="79" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">público</text>

  <text x="22" y="138" text-anchor="start" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE OUVE?</text>
  <rect x="22" y="152" width="205" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="22" y="195" width="205" height="3" fill="#3A6098"/><text x="30" y="171" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">A família conta quando eu</text><text x="30" y="185" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">pergunto</text><rect x="22" y="206" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="22" y="235" width="205" height="3" fill="#3A6098"/><text x="30" y="225" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">O tio que sabe das coisas</text><rect x="22" y="246" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="22" y="275" width="205" height="3" fill="#3A6098"/><text x="30" y="265" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Ninguém pedindo o que eu tenho</text>

  <text x="918" y="138" text-anchor="end" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE VÊ?</text>
  <rect x="713" y="152" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="713" y="181" width="205" height="3" fill="#3A6098"/><text x="721" y="171" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">O álbum da mãe que ninguém abre</text><rect x="713" y="192" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="713" y="221" width="205" height="3" fill="#3A6098"/><text x="721" y="211" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Prédios vazios e gente na porta</text><rect x="713" y="232" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="713" y="261" width="205" height="3" fill="#3A6098"/><text x="721" y="251" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">O parque que já foi hospital</text><rect x="713" y="272" width="205" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="713" y="315" width="205" height="3" fill="#3A6098"/><text x="721" y="291" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Rede social sem nada do que eu</text><text x="721" y="305" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">sei</text>

  <svg x="412" y="177" width="116" height="116" viewBox="0 0 120 120">
    <defs><clipPath id="rc-tiago"><circle cx="60" cy="60" r="57"/></clipPath></defs>
    <g clip-path="url(#rc-tiago)">
      <circle cx="60" cy="60" r="57" fill="#DFDCD1"/>
      <path d="M60 86c-24 0-40 15-42 36h84c-2-21-18-36-42-36z" fill="#2E6E68"/>
      <rect x="52" y="70" width="16" height="22" rx="8" fill="#9C6844"/>
      <ellipse cx="60" cy="54" rx="21" ry="24" fill="#B37C55"/>
      <path d="M39 50c1-13 10-21 21-21s20 8 21 21c1-4 1-9 0-13-2-9-10-15-21-15s-19 6-21 15c-1 4-1 9 0 13z" fill="#241C14"/>
      <path d="M43 62c0 12 7 20 17 20s17-8 17-20c1 8-1 16-6 21-3 3-7 5-11 5s-8-2-11-5c-5-5-7-13-6-21z" fill="#241C14"/>
      <ellipse cx="52" cy="53" rx="2.6" ry="3" fill="#241C14"/>
      <ellipse cx="68" cy="53" rx="2.6" ry="3" fill="#241C14"/>
      <path d="M46 46c3-2 8-2 10 1M64 47c2-3 7-3 10-1" stroke="#241C14" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M60 57v5c0 1-1 2-2 2" stroke="#7C4F32" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M54 69c3 2 9 2 12 0" stroke="#5E3A24" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <circle cx="60" cy="60" r="57" fill="none" stroke="#F4F3EE" stroke-width="2.5"/>
  </svg>

  <text x="470" y="348" text-anchor="middle" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE DIZ E FAZ?</text>
  <rect x="72" y="362" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="72" y="405" width="190" height="3" fill="#3A6098"/><text x="80" y="381" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Conto a história do bisavô</text><text x="80" y="395" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">sempre</text><rect x="274" y="362" width="190" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="274" y="391" width="190" height="3" fill="#3A6098"/><text x="282" y="381" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Pergunto pros mais velhos</text><rect x="476" y="362" width="190" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="476" y="391" width="190" height="3" fill="#3A6098"/><text x="484" y="381" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Guardo, não digitalizo</text><rect x="678" y="362" width="190" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="678" y="391" width="190" height="3" fill="#3A6098"/><text x="686" y="381" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Mandaria só a foto</text>

  <rect x="2" y="446" width="460" height="250" fill="#EAE8E0" stroke="#1A1D23" stroke-width="2"/>
  <text x="20" y="474" text-anchor="start" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#B4471F">DORES</text>
  <rect x="36" y="492" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="521" width="414" height="3" fill="#B4471F"/><text x="44" y="511" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Nunca me passou pela cabeça</text><rect x="36" y="531" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="560" width="414" height="3" fill="#B4471F"/><text x="44" y="550" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Acho que não interessa a ninguém</text><rect x="36" y="570" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="599" width="414" height="3" fill="#B4471F"/><text x="44" y="589" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">A foto é de papel</text><rect x="36" y="609" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="638" width="414" height="3" fill="#B4471F"/><text x="44" y="628" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Escrever relato dá trabalho</text><rect x="36" y="648" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="677" width="414" height="3" fill="#B4471F"/><text x="44" y="667" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Preciso ver gente séria usando</text>

  <rect x="478" y="446" width="444" height="250" fill="#EAE8E0" stroke="#1A1D23" stroke-width="2"/>
  <text x="496" y="474" text-anchor="start" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#2E6E68">NECESSIDADES</text>
  <rect x="514" y="492" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="521" width="414" height="3" fill="#2E6E68"/><text x="522" y="511" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Que alguém me peça</text><rect x="514" y="531" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="560" width="414" height="3" fill="#2E6E68"/><text x="522" y="550" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Ver que outros já contaram</text><rect x="514" y="570" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="599" width="414" height="3" fill="#2E6E68"/><text x="522" y="589" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Dois minutos, sem escrever nada</text><rect x="514" y="609" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="638" width="414" height="3" fill="#2E6E68"/><text x="522" y="628" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Saber quem cuida disso</text><rect x="514" y="648" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="677" width="414" height="3" fill="#2E6E68"/><text x="522" y="667" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Que fique lá sem eu estar junto</text>
</svg>
