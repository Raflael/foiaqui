    <circle cx="60" cy="60" r="57" fill="none" stroke="#F4F3EE" stroke-width="2.5"/>
  </svg>

  <text x="470" y="332" text-anchor="middle" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE DIZ E FAZ?</text>
  <rect x="72" y="346" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="72" y="389" width="190" height="3" fill="#3A6098"/><text x="80" y="365" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Conto como era quando</text><text x="80" y="379" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">cheguei</text><rect x="274" y="346" width="190" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="274" y="375" width="190" height="3" fill="#3A6098"/><text x="282" y="365" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Uso o celular todo dia</text><rect x="476" y="346" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="476" y="389" width="190" height="3" fill="#3A6098"/><text x="484" y="365" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Perguntei a alguém e</text><text x="484" y="379" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">descobri</text><rect x="678" y="346" width="190" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="678" y="375" width="190" height="3" fill="#3A6098"/><text x="686" y="365" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Não mandaria nada, hoje</text>

  <rect x="2" y="430" width="460" height="250" fill="#EAE8E0" stroke="#1A1D23" stroke-width="2"/>
  <text x="20" y="458" text-anchor="start" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#B4471F">DORES</text>
  <rect x="36" y="476" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="505" width="414" height="3" fill="#B4471F"/><text x="44" y="495" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Não sei quem vai ver</text><rect x="36" y="515" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="544" width="414" height="3" fill="#B4471F"/><text x="44" y="534" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">E se usarem de um jeito errado?</text><rect x="36" y="554" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="583" width="414" height="3" fill="#B4471F"/><text x="44" y="573" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Não dá pra desfazer</text><rect x="36" y="593" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="622" width="414" height="3" fill="#B4471F"/><text x="44" y="612" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Cadastro logo na entrada</text><rect x="36" y="632" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="661" width="414" height="3" fill="#B4471F"/><text x="44" y="651" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Cheguei depois — vale menos?</text>

  <rect x="478" y="430" width="444" height="250" fill="#EAE8E0" stroke="#1A1D23" stroke-width="2"/>
  <text x="496" y="458" text-anchor="start" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#2E6E68">NECESSIDADES</text>
  <rect x="514" y="476" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="505" width="414" height="3" fill="#2E6E68"/><text x="522" y="495" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Dizer quem vê, antes de eu enviar</text><rect x="514" y="515" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="544" width="414" height="3" fill="#2E6E68"/><text x="522" y="534" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Poder apagar depois</text><rect x="514" y="554" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="583" width="414" height="3" fill="#2E6E68"/><text x="522" y="573" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Meu nome, se eu quiser</text><rect x="514" y="593" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="622" width="414" height="3" fill="#2E6E68"/><text x="522" y="612" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Memória de quem chegou também conta</text><rect x="514" y="632" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="661" width="414" height="3" fill="#2E6E68"/><text x="522" y="651" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Ver antes de decidir</text>
</svg>
