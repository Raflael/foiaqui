<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 684" width="940" height="684" role="img" aria-label="Mapa de empatia de Neuza">
  <rect width="940" height="684" fill="#EAE8E0"/>

  <rect x="2" y="2" width="936" height="410" fill="none" stroke="#1A1D23" stroke-width="2"/>
  <g stroke="#CFCABA" stroke-width="1.2" stroke-dasharray="7 5">
    <line x1="2" y1="2" x2="938" y2="412"/>
    <line x1="938" y1="2" x2="2" y2="412"/>
  </g>

  <text x="470" y="30" text-anchor="middle" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE PENSA E SENTE?</text>
  <rect x="72" y="46" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="72" y="89" width="190" height="3" fill="#3A6098"/><text x="80" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">A vida tá passando rápido</text><text x="80" y="79" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">demais</text><rect x="274" y="46" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="274" y="89" width="190" height="3" fill="#3A6098"/><text x="282" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Minha memória começa tarde</text><text x="282" y="79" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">demais</text><rect x="476" y="46" width="190" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="476" y="75" width="190" height="3" fill="#3A6098"/><text x="484" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Onde é que isso vai parar?</text><rect x="678" y="46" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="678" y="89" width="190" height="3" fill="#3A6098"/><text x="686" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">O que é meu tem que</text><text x="686" y="79" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">continuar meu</text>

  <text x="22" y="138" text-anchor="start" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE OUVE?</text>
  <rect x="22" y="152" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="22" y="181" width="205" height="3" fill="#3A6098"/><text x="30" y="171" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Em lugar nenhum</text><rect x="22" y="192" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="22" y="221" width="205" height="3" fill="#3A6098"/><text x="30" y="211" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Os filhos não perguntam</text><rect x="22" y="232" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="22" y="261" width="205" height="3" fill="#3A6098"/><text x="30" y="251" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Notícia de demolição, quando dá</text>

  <text x="918" y="138" text-anchor="end" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE VÊ?</text>
  <rect x="713" y="152" width="205" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="713" y="195" width="205" height="3" fill="#3A6098"/><text x="721" y="171" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Uma cidade que mudou sem</text><text x="721" y="185" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">registro</text><rect x="713" y="206" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="713" y="235" width="205" height="3" fill="#3A6098"/><text x="721" y="225" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Nenhuma placa contando nada</text><rect x="713" y="246" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="713" y="275" width="205" height="3" fill="#3A6098"/><text x="721" y="265" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">As fotos ficaram no Nordeste</text>

  <svg x="412" y="169" width="116" height="116" viewBox="0 0 120 120">
    <defs><clipPath id="rc-neuza"><circle cx="60" cy="60" r="57"/></clipPath></defs>
