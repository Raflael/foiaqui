<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 728" width="940" height="728" role="img" aria-label="Mapa de empatia de Camila">
  <rect width="940" height="728" fill="#EAE8E0"/>

  <rect x="2" y="2" width="936" height="454" fill="none" stroke="#1A1D23" stroke-width="2"/>
  <g stroke="#CFCABA" stroke-width="1.2" stroke-dasharray="7 5">
    <line x1="2" y1="2" x2="938" y2="456"/>
    <line x1="938" y1="2" x2="2" y2="456"/>
  </g>

  <text x="470" y="30" text-anchor="middle" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE PENSA E SENTE?</text>
  <rect x="72" y="46" width="190" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="72" y="75" width="190" height="3" fill="#3A6098"/><text x="80" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">O que será que faziam ali?</text><rect x="274" y="46" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="274" y="89" width="190" height="3" fill="#3A6098"/><text x="282" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Acho bonito antes de achar</text><text x="282" y="79" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">histórico</text><rect x="476" y="46" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="476" y="89" width="190" height="3" fill="#3A6098"/><text x="484" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">A cidade tem camadas que eu</text><text x="484" y="79" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">não alcanço</text><rect x="678" y="46" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="678" y="89" width="190" height="3" fill="#3A6098"/><text x="686" y="65" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">História é coisa de quem</text><text x="686" y="79" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">estudou</text>

  <text x="22" y="138" text-anchor="start" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE OUVE?</text>
  <rect x="22" y="152" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="22" y="181" width="205" height="3" fill="#3A6098"/><text x="30" y="171" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Professor citando de passagem</text><rect x="22" y="192" width="205" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="22" y="235" width="205" height="3" fill="#3A6098"/><text x="30" y="211" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Jornal local, quando vira</text><text x="30" y="225" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">notícia</text><rect x="22" y="246" width="205" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="22" y="289" width="205" height="3" fill="#3A6098"/><text x="30" y="265" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Ninguém mais velho por perto</text><text x="30" y="279" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">pra perguntar</text>

  <text x="918" y="138" text-anchor="end" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE VÊ?</text>
  <rect x="713" y="152" width="205" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="713" y="195" width="205" height="3" fill="#3A6098"/><text x="721" y="171" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Fachadas fechadas com placa de</text><text x="721" y="185" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">aluguel</text><rect x="713" y="206" width="205" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="713" y="249" width="205" height="3" fill="#3A6098"/><text x="721" y="225" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Placas de rua sem explicação</text><text x="721" y="239" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">nenhuma</text><rect x="713" y="260" width="205" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="713" y="289" width="205" height="3" fill="#3A6098"/><text x="721" y="279" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Google que só fala do imóvel</text><rect x="713" y="300" width="205" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="713" y="343" width="205" height="3" fill="#3A6098"/><text x="721" y="319" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Vídeo de história — de outras</text><text x="721" y="333" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">cidades</text>

  <svg x="412" y="191" width="116" height="116" viewBox="0 0 120 120">
    <defs><clipPath id="rc-camila"><circle cx="60" cy="60" r="57"/></clipPath></defs>
    <g clip-path="url(#rc-camila)">
      <circle cx="60" cy="60" r="57" fill="#DFDCD1"/>
      <path d="M60 86c-24 0-40 15-42 36h84c-2-21-18-36-42-36z" fill="#B4471F"/>
      <rect x="52" y="70" width="16" height="22" rx="8" fill="#B87A55"/>
      <ellipse cx="60" cy="54" rx="21" ry="24" fill="#CD8E67"/>
      <path d="M39 52c0-15 9-25 21-25s21 10 21 25c2-6 3-13 1-19-3-11-12-17-22-17s-19 6-22 17c-2 6-1 13 1 19z" fill="#2B2119"/>
      <path d="M37 46c-3 10-2 22 2 30-6-4-9-14-8-24 1-8 4-14 9-19zM83 46c3 10 2 22-2 30 6-4 9-14 8-24-1-8-4-14-9-19z" fill="#2B2119"/>
      <ellipse cx="52" cy="54" rx="2.6" ry="3" fill="#2B2119"/>
      <ellipse cx="68" cy="54" rx="2.6" ry="3" fill="#2B2119"/>
      <path d="M47 47c3-2 7-2 9 0M64 47c3-2 7-2 9 0" stroke="#2B2119" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M60 58v5c0 1-1 2-2 2" stroke="#8C5B3E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M54 70c3 3 9 3 12 0" stroke="#8C5B3E" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <circle cx="60" cy="60" r="57" fill="none" stroke="#F4F3EE" stroke-width="2.5"/>
  </svg>

  <text x="470" y="376" text-anchor="middle" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#14396E">O QUE DIZ E FAZ?</text>
  <rect x="72" y="390" width="190" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="72" y="419" width="190" height="3" fill="#3A6098"/><text x="80" y="409" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Pesquisa uma vez e desiste</text><rect x="274" y="390" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="274" y="433" width="190" height="3" fill="#3A6098"/><text x="282" y="409" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Fotografa fachada e posta no</text><text x="282" y="423" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">story</text><rect x="476" y="390" width="190" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="476" y="419" width="190" height="3" fill="#3A6098"/><text x="484" y="409" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Reposta o que descobre</text><rect x="678" y="390" width="190" height="46" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="678" y="433" width="190" height="3" fill="#3A6098"/><text x="686" y="409" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Mandaria o que já tem no</text><text x="686" y="423" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">celular</text>

  <rect x="2" y="474" width="460" height="250" fill="#EAE8E0" stroke="#1A1D23" stroke-width="2"/>
  <text x="20" y="502" text-anchor="start" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#B4471F">DORES</text>
  <rect x="36" y="520" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="549" width="414" height="3" fill="#B4471F"/><text x="44" y="539" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Procurei e não achei</text><rect x="36" y="559" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="588" width="414" height="3" fill="#B4471F"/><text x="44" y="578" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Cadastro antes de ver qualquer coisa</text><rect x="36" y="598" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="627" width="414" height="3" fill="#B4471F"/><text x="44" y="617" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Se for pago, eu fecho</text><rect x="36" y="637" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="666" width="414" height="3" fill="#B4471F"/><text x="44" y="656" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Muito texto pra ler no sol</text><rect x="36" y="676" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="36" y="705" width="414" height="3" fill="#B4471F"/><text x="44" y="695" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Abrir e não ter nada perto de mim</text>

  <rect x="478" y="474" width="444" height="250" fill="#EAE8E0" stroke="#1A1D23" stroke-width="2"/>
  <text x="496" y="502" text-anchor="start" font-family="'Arial Narrow', Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#2E6E68">NECESSIDADES</text>
  <rect x="514" y="520" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="549" width="414" height="3" fill="#2E6E68"/><text x="522" y="539" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Resposta ali, na hora</text><rect x="514" y="559" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="588" width="414" height="3" fill="#2E6E68"/><text x="522" y="578" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Uma placa na rua que me convide</text><rect x="514" y="598" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="627" width="414" height="3" fill="#2E6E68"/><text x="522" y="617" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Tom de conversa, não de verbete</text><rect x="514" y="637" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="666" width="414" height="3" fill="#2E6E68"/><text x="522" y="656" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Pouco texto, com imagem</text><rect x="514" y="676" width="414" height="32" fill="#F4F3EE" stroke="#CFCABA" stroke-width="1"/><rect x="514" y="705" width="414" height="3" fill="#2E6E68"/><text x="522" y="695" font-size="11.5" font-family="Helvetica, Arial, sans-serif" fill="#1A1D23">Poder mostrar aos outros</text>
</svg>
